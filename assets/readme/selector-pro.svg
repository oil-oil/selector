          <rect x="289" y="-5" width="10" height="10" fill="#D85436"/>
          <rect x="-5" y="61" width="10" height="10" fill="#D85436"/>
          <rect x="289" y="61" width="10" height="10" fill="#D85436"/>
          <circle cx="31" cy="33" r="14" fill="#111110"/>
          <rect x="58" y="20" width="112" height="10" rx="5" fill="#7C7871"/>
          <rect x="58" y="39" width="174" height="8" rx="4" fill="#C7C2B8"/>
