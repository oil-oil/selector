<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">Selector Pro — a better Selector for everyday use</title>
  <desc id="desc">Selector Pro stays active across tabs, captures complete elements without dialogs, and syncs settings.</desc>

  <defs>
    <linearGradient id="edge-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E96A4C"/>
      <stop offset="0.5" stop-color="#D85436"/>
      <stop offset="1" stop-color="#A83A28"/>
    </linearGradient>
    <clipPath id="canvas-clip">
      <rect width="1200" height="380" rx="26"/>
    </clipPath>
    <clipPath id="browser-clip">
      <rect width="396" height="284" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas-clip)">
    <rect width="1200" height="380" fill="#111110"/>
    <rect x="0" width="17" height="380" fill="url(#edge-gradient)"/>
    <circle cx="670" cy="52" r="188" fill="#191816"/>
    <circle cx="692" cy="330" r="140" fill="#171614"/>
  </g>

  <g id="copy" transform="translate(66 0)">
    <g transform="translate(0 42)">
      <rect width="226" height="30" rx="15" fill="#282521"/>
      <circle cx="17" cy="15" r="5" fill="#D85436"/>
      <text x="31" y="20"
            fill="#BDB8AF"
            font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
            font-size="13" font-weight="700" letter-spacing="1.6">THE BETTER VERSION</text>
    </g>

    <text x="0" y="145"
          fill="#F1EEE6"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="68" font-weight="800" letter-spacing="-3.2">Selector</text>

    <g transform="translate(286 101)">
      <rect width="102" height="44" rx="8"
            fill="#201F1C" stroke="#D85436" stroke-width="2"/>
      <text x="51" y="31"
            fill="#F1EEE6" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
            font-size="25" font-weight="750" letter-spacing="1">PRO</text>
    </g>

    <text x="0" y="192"
